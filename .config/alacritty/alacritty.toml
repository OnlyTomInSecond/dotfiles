[env]
TERM = "xterm-256color"

[font]
size = 11.0

[font.bold]
family = "monospace"
style = "Bold"

[font.bold_italic]
family = "monospace"
style = "Bold Italic"

[font.italic]
family = "monospace"
style = "Italic"

[font.normal]
family = "monospace"
style = "Regular"

[scrolling]
history = 10000

[cursor]
style = {shape = "Block", blinking = "Never"}
vi_mode_style = "None"
#thickness = 0.2

[general]
import = [
    "~/.config/alacritty/themes/doom_one.toml"
]

[window]
dimensions = { columns = 100, lines = 30 }

[keyboard]
bindings = [
{ key = "N", mods = "Control|Shift", action = "CreateNewWindow" },
]
