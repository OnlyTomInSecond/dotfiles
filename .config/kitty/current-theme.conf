# Theme: Doom One (kept in sync with
# ~/.config/alacritty/themes/doom_one.toml). To switch themes, replace this
# whole file; kitty.conf pulls it in with an include at the end.

# Default colors
foreground            #bbc2cf
background            #282c34

# Selection
selection_foreground  #282c34
selection_background  #bbc2cf

# Links
url_color             #51afef

# Normal colors (0-7)
color0  #282c34   # Black
color1  #ff6c6b   # Red
color2  #98be65   # Green
color3  #ecbe7b   # Yellow
color4  #51afef   # Blue
color5  #c678dd   # Magenta
color6  #46d9ff   # Cyan
color7  #bbc2cf   # White

# Bright colors (8-15)
color8  #595959   # Bright Black
color9  #ff6655   # Bright Red
color10 #99bb66   # Bright Green
color11 #ecbe7b   # Bright Yellow
color12 #51afef   # Bright Blue
color13 #c678dd   # Bright Magenta
color14 #46d9ff   # Bright Cyan
color15 #bfbfbf   # Bright White

# Cursor (Alacritty: block shape, no blinking)
cursor            #51afef
cursor_text_color background

# Tab bar
active_tab_foreground   #282c34
active_tab_background   #51afef
inactive_tab_foreground #bbc2cf
inactive_tab_background #3f444a

# Mark colors (kitty only supports mark1-3)
mark1_foreground #282c34
mark1_background #ff6c6b

mark2_foreground #282c34
mark2_background #98be65

mark3_foreground #282c34
mark3_background #ecbe7b
