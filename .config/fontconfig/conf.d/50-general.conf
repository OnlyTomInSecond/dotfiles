<?xml version='1.0'?>
<!DOCTYPE fontconfig SYSTEM 'urn:fontconfig:fonts.dtd'>
<fontconfig>
 <!--
   Font stack:

     sans-serif : Sarasa UI SC  = Inter (Latin/Greek/Cyrillic)
                                + Source Han Sans (CJK)   [ttfautohint]
                  Noto Sans / Noto Sans CJK SC  -> glyph coverage fallback
     serif      : Noto Serif (Latin serif) + Sarasa UI SC (CJK, no CJK serif
                  exists in Sarasa) + Noto Serif CJK SC as coverage fallback
     monospace  : Source Code Pro (Latin) + Sarasa Mono SC (CJK)
                  Sarasa Mono SC alone is Iosevka for Latin, which is much
                  narrower (0.50em vs 0.60em avg) - keep a normal-width mono
                  first and only use Sarasa for the CJK part.
     fallback   : Jigmo2 (Ext B-F, I) / Jigmo3 (Ext G, H, J) for rare hanzi

   Regional glyph variants (TC/HC/J/K) are selected in 51-cjk.conf.
 -->
 <!-- Default system-ui fonts -->
 <match target="pattern">
  <test name="family">
   <string>system-ui</string>
  </test>
  <edit binding="strong" mode="prepend" name="family">
   <string>sans-serif</string>
  </edit>
 </match>
 <!-- Default sans-serif fonts: Sarasa first so Latin is Inter too -->
 <match target="pattern">
  <test name="family">
   <string>sans-serif</string>
  </test>
  <edit binding="strong" mode="prepend" name="family">
   <string>Sarasa UI SC</string>
   <string>Noto Sans</string>
   <string>Noto Sans CJK SC</string>
   <string>Noto Color Emoji</string>
   <string>Jigmo2</string>
   <string>Jigmo3</string>
  </edit>
 </match>
 <!-- Default serif fonts: Latin stays serif, CJK is Sarasa -->
 <match target="pattern">
  <test name="family">
   <string>serif</string>
  </test>
  <edit binding="strong" mode="prepend" name="family">
   <string>Noto Serif</string>
   <string>Sarasa UI SC</string>
   <string>Noto Serif CJK SC</string>
   <string>Jigmo2</string>
   <string>Jigmo3</string>
  </edit>
 </match>
 <!-- Default monospace fonts: Sarasa Mono SC (Iosevka Latin + CJK) -->
 <match target="pattern">
  <test name="family">
   <string>monospace</string>
  </test>
  <edit binding="strong" mode="prepend" name="family">
   <string>Source Code Pro</string>
   <string>Sarasa Mono SC</string>
   <string>Noto Sans Mono CJK SC</string>
   <string>Jigmo2</string>
   <string>Jigmo3</string>
  </edit>
 </match>
 <match target="font">
  <edit mode="assign" name="hinting">
   <bool>true</bool>
  </edit>
 </match>
 <match target="font">
  <edit mode="assign" name="hintstyle">
   <const>hintslight</const>
  </edit>
 </match>
 <match target="font">
  <edit mode="assign" name="rgba">
   <const>rgb</const>
  </edit>
 </match>
 <dir>~/.local/share/fonts</dir>
 <match target="font">
  <edit mode="assign" name="antialias">
   <bool>true</bool>
  </edit>
 </match>
</fontconfig>
