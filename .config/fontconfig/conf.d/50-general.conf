<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>

  <!--
    Generic families only.

    Do not alias concrete family names (Arial, PingFang SC, Microsoft YaHei,
    ...).  fontconfig already falls back per codepoint, so a Latin-only request
    such as Arial gets Arial for Latin and the CJK face below for Han.  Adding
    concrete aliases only overrides a typeface the application explicitly
    asked for.

    The three stacks are:
      sans  : Noto Sans + Noto Sans CJK SC + emoji + Jigmo
      serif : Noto Serif + Noto Serif CJK SC + emoji + Jigmo
      mono  : Noto Sans Mono + emoji + Noto Sans Mono CJK SC + Jigmo

    Noto Sans Mono (0.60 em Latin) comes before the CJK-only monospace face;
    with the latter first, Latin is forced to 0.50 em and looks too narrow.

    Emoji comes before the CJK faces: terminals choose a fallback per
    codepoint without looking at VS16/ZWJ, and Noto Sans CJK also covers the
    squared-CJK emoji block (U+1F200-1F2FF).  With CJK first, U+1F21A would be
    rendered by the monochrome CJK glyph.

    Regional CJK forms (SC/TC/HK/JP/KR) are not selected here.  All five Noto
    CJK faces contain the same glyphs and the same lang/charset metadata; the
    regional form is chosen by OpenType locl from the text language passed to
    HarfBuzz.  Pinning SC therefore only sets the default form for renderers
    that do not pass a language (e.g. most terminals).
  -->

  <match target="pattern">
    <test name="family"><string>system-ui</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>sans-serif</string>
    </edit>
  </match>

  <!-- binding="strong" keeps Noto Sans as the metric source even when the
       pattern carries lang=zh/ja/ko.  This keeps the Breeze title bar at
       28 px (Noto Sans "M" cap height = 10 px at 11 pt, not 11 px). -->
  <match target="pattern">
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans</string>
      <string>Noto Color Emoji</string>
      <string>Noto Sans CJK SC</string>
      <string>Jigmo2</string>
      <string>Jigmo3</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family"><string>serif</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Serif</string>
      <string>Noto Color Emoji</string>
      <string>Noto Serif CJK SC</string>
      <string>Jigmo2</string>
      <string>Jigmo3</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family"><string>monospace</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans Mono</string>
      <string>Noto Color Emoji</string>
      <string>Noto Sans Mono CJK SC</string>
      <string>Jigmo2</string>
      <string>Jigmo3</string>
    </edit>
  </match>

  <!-- Synthetic oblique for faces without an italic/oblique master. -->
  <match target="font">
    <test name="slant"><const>roman</const></test>
    <test name="slant" target="pattern" compare="not_eq"><const>roman</const></test>
    <edit name="matrix" mode="assign">
      <times>
        <name>matrix</name>
        <matrix>
          <double>1</double><double>0.2</double>
          <double>0</double><double>1</double>
        </matrix>
      </times>
    </edit>
    <edit name="slant" mode="assign"><const>oblique</const></edit>
    <edit name="embeddedbitmap" mode="assign"><bool>false</bool></edit>
  </match>

  <!-- Synthetic bold for faces without a bold master. -->
  <match target="font">
    <test name="weight" compare="less_eq"><const>medium</const></test>
    <test name="weight" target="pattern" compare="more_eq"><const>bold</const></test>
    <edit name="embolden" mode="assign"><bool>true</bool></edit>
    <edit name="weight" mode="assign"><const>bold</const></edit>
  </match>

  <!-- Rendering on this 109 PPI panel, Qt/Wayland scale 1.0.

       Grayscale AA: KWin/Qt6/GTK4 do not use subpixel AA, and lcddefault
       thins stems in XWayland/Xft apps.

       hintslight, not hintfull: hintfull pushes Noto Sans "M" to 11 px,
       which inflates the Breeze title bar from 28 px to 36 px. -->
  <match target="font">
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="embeddedbitmap" mode="assign"><bool>false</bool></edit>
  </match>

  <!-- Bitmap-only emoji faces (Noto Color Emoji / blobmoji) have a CBDT strike
       and no outlines.  With embeddedbitmap=false, cairo/FreeType set
       FT_LOAD_NO_BITMAP and draw nothing. -->
  <match target="font">
    <test name="family"><string>Noto Color Emoji</string></test>
    <edit name="embeddedbitmap" mode="assign"><bool>true</bool></edit>
  </match>

</fontconfig>
