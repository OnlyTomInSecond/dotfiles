<?xml version='1.0'?>
<!DOCTYPE fontconfig SYSTEM 'urn:fontconfig:fonts.dtd'>
<fontconfig>
 <!--
   Font stack:

     sans-serif : Noto Sans (Latin/Greek/Cyrillic) + Noto Sans CJK SC
                  (CJK = Source Han Sans) + Noto Color Emoji
                  + Jigmo2/Jigmo3 for rare hanzi
     serif      : Noto Serif (Latin serif) + Noto Serif CJK SC
                  (CJK = Source Han Serif) + Jigmo2/Jigmo3
     monospace  : Noto Sans Mono (Latin, 0.60 em advance)
                  + Noto Sans Mono CJK SC (CJK, 1.00 em).  Noto Sans Mono CJK
                  alone brings 0.50 em Latin, which is visibly narrow; the
                  proportional-width Noto Sans Mono comes first so Latin keeps
                  a normal code width (CJK/Latin = 1.67).
                  Noto Color Emoji is listed before the Jigmo faces, otherwise
                  `fc-match "monospace:charset=1f600"` falls through to
                  Segoe UI Symbol (monochrome) and emoji get a mismatched
                  advance in terminals.
     fallback   : Jigmo2 (Ext B-F, I) / Jigmo3 (Ext G, H, J) for rare hanzi

   KDE / Breeze titlebar:
     Breeze derives its layout grid from the *window title* font, not from the
     body font (KDecoration3::DecorationSettings and Breeze::Decoration):

       gridUnit     = round_up_to_even(QFontMetrics(titleFont).boundingRect("M").height())
       smallSpacing = max(2, gridUnit / 4)
       buttonSize   = 2 * gridUnit                       (Breeze default)
       titleHeight  = max(QFontMetrics(titleFont).height(), buttonSize)
                      + 4 * smallSpacing

     The title font is kdeglobals [WM] activeFont (currently "Sans Serif 11",
     i.e. whatever this file puts first in the sans-serif stack = Noto Sans).
     At 11 pt / 96 dpi / hintslight its "M" ink box must stay at 10 px:

       capM = 10  -> gridUnit 10 -> 28 px titlebar, 20 px buttons  (compact)
       capM = 11  -> gridUnit 12 -> 36 px titlebar, 24 px buttons  (inflated)

     Measured at 11 pt with hintslight:
       capM 10 : Noto Sans, Liberation Sans, Noto Serif, Source Sans 3,
                 Corbel, Times New Roman, Noto Sans Mono, Liberation Mono
       capM 11+: Inter / Sarasa UI SC, Sarasa Mono / Term / Fixed SC, Roboto,
                 DejaVu Sans, Adwaita Sans, Arial, Segoe UI, Noto Sans CJK SC,
                 Maple Mono NF CN, Georgia

     Noto Sans keeps the 10 px ink box, so the compact 28 px decoration holds.
     Swapping the sans-serif stack for a high-cap-height face (Sarasa / Inter /
     Roboto / DejaVu) inflates it to 36 px; hintfull does the same for every
     font, which is why hintstyle stays hintslight below.

   Regional glyph variants (TC/HC/J/K) are selected in 51-cjk.conf.
 -->
 <!-- Default system-ui fonts -->
 <match target="pattern">
  <test name="family">
   <string>system-ui</string>
  </test>
  <edit binding="strong" mode="prepend" name="family">
   <string>sans-serif</string>
  </edit>
 </match>
 <!-- Default sans-serif fonts: Noto Sans (Latin) + Noto Sans CJK SC (CJK).
      Noto Sans is also the metric source for the Breeze titlebar (capM 10 px
      at 11 pt -> 28 px titlebar). -->
 <match target="pattern">
  <test name="family">
   <string>sans-serif</string>
  </test>
  <edit binding="strong" mode="prepend" name="family">
   <string>Noto Sans</string>
   <string>Noto Sans CJK SC</string>
   <string>Noto Color Emoji</string>
   <string>Jigmo2</string>
   <string>Jigmo3</string>
  </edit>
 </match>
 <!-- Default serif fonts: Noto Serif (Latin) + Noto Serif CJK SC (CJK) -->
 <match target="pattern">
  <test name="family">
   <string>serif</string>
  </test>
  <edit binding="strong" mode="prepend" name="family">
   <string>Noto Serif</string>
   <string>Noto Serif CJK SC</string>
   <string>Noto Color Emoji</string>
   <string>Jigmo2</string>
   <string>Jigmo3</string>
  </edit>
 </match>
 <!-- Default monospace fonts: Noto Sans Mono (Latin, 0.60 em) + Noto Sans
      Mono CJK SC (CJK, 1.00 em). The CJK-only face would force Latin to
      0.50 em and make it look thin. -->
 <match target="pattern">
  <test name="family">
   <string>monospace</string>
  </test>
  <edit binding="strong" mode="prepend" name="family">
   <string>Noto Sans Mono</string>
   <string>Noto Sans Mono CJK SC</string>
   <string>Noto Color Emoji</string>
   <string>Jigmo2</string>
   <string>Jigmo3</string>
  </edit>
 </match>
 <match target="font">
  <edit mode="assign" name="hinting">
   <bool>true</bool>
  </edit>
 </match>
 <!-- hintslight, not hintfull: hintfull looks slightly crisper for dense CJK
      but pushes the "M" ink box of every font to 11 px, which inflates the
      Breeze titlebar from 28 px to 36 px (see the titlebar note above).
      FreeType only distinguishes hintslight (light target) from
      hintmedium == hintfull (normal target); hintnone disables hinting. -->
 <match target="font">
  <edit mode="assign" name="hintstyle">
   <const>hintslight</const>
  </edit>
 </match>
 <!-- Grayscale antialiasing. Qt6 / GTK4 already default to grayscale on
      Wayland, and where sub-pixel rendering is still used (XWayland,
      Xft-based apps) `lcddefault` low-passes the stems and visually thins
      them out. Set rgba to `rgb` (and lcdfilter to lcdlight/lcdnone) only
      after checking that the panel sub-pixel order really is RGB. -->
 <match target="font">
  <edit mode="assign" name="rgba">
   <const>none</const>
  </edit>
 </match>
 <!-- Embedded bitmaps (WPS Calibri/Cambria/Courier New/Lucida Console ship
      some) get scaled when they do not match the requested pixel size, which
      looks blurry; prefer outlines + hinting. -->
 <match target="font">
  <edit mode="assign" name="embeddedbitmap">
   <bool>false</bool>
  </edit>
 </match>
 <dir>~/.local/share/fonts</dir>
 <match target="font">
  <edit mode="assign" name="antialias">
   <bool>true</bool>
  </edit>
 </match>
</fontconfig>
