<?xml version='1.0'?>
<!DOCTYPE fontconfig SYSTEM 'urn:fontconfig:fonts.dtd'>
<fontconfig>
 <!--
   Font stack:

     sans-serif : Liberation Sans (Latin/Greek/Cyrillic)
                  + Sarasa UI SC (CJK = Source Han Sans, ttfautohint)
                  + Noto Sans CJK SC  -> glyph coverage fallback
     serif      : Liberation Serif (Latin serif) + Sarasa UI SC (CJK, no CJK
                  serif exists in Sarasa) + Noto Serif CJK SC as coverage
                  fallback
     monospace  : Liberation Mono (Latin) + Sarasa Mono SC (CJK)
                  Sarasa Mono SC alone is Iosevka for Latin, which is much
                  narrower (0.50em vs 0.60em avg) - keep a normal-width mono
                  first and only use Sarasa for the CJK part.
     fallback   : Jigmo2 (Ext B-F, I) / Jigmo3 (Ext G, H, J) for rare hanzi

   KDE / Breeze titlebar:
     Breeze derives its layout grid from the *window title* font, not from the
     body font (KDecoration3::DecorationSettings and Breeze::Decoration):

       gridUnit     = round_up_to_even(QFontMetrics(titleFont).boundingRect("M").height())
       smallSpacing = max(2, gridUnit / 4)
       buttonSize   = 2 * gridUnit                       (Breeze default)
       titleHeight  = max(QFontMetrics(titleFont).height(), buttonSize)
                      + 4 * smallSpacing

     At 11 pt / 96 dpi the ink box of "M" is 10 px in Liberation Sans (and
     Noto Sans), but 11 px in Inter / Sarasa UI SC. The odd pixel is rounded up
     to a gridUnit of 12 instead of 10, which inflates the 11 pt titlebar from
     28 px to 36 px and the window buttons from 20 px to 24 px. Liberation Sans
     is therefore kept first so the default 11 pt Breeze decoration stays
     compact. This relies on hintslight below: with hinting off, the "M" of
     Liberation Sans becomes 11 px again and the decoration grows back. If the
     Inter look is preferred, put Sarasa UI SC first again and set the KDE
     "Window title" font to Liberation Sans (or Noto Sans) in System Settings >
     Fonts, so only the decoration uses the compact font.

   Regional glyph variants (TC/HC/J/K) are selected in 51-cjk.conf.
 -->
 <!-- Default system-ui fonts -->
 <match target="pattern">
  <test name="family">
   <string>system-ui</string>
  </test>
  <edit binding="strong" mode="prepend" name="family">
   <string>sans-serif</string>
  </edit>
 </match>
 <!-- Default sans-serif fonts: Liberation Sans first for compact Breeze metrics -->
 <match target="pattern">
  <test name="family">
   <string>sans-serif</string>
  </test>
  <edit binding="strong" mode="prepend" name="family">
   <string>Liberation Sans</string>
   <string>Sarasa UI SC</string>
   <string>Noto Sans CJK SC</string>
   <string>Noto Color Emoji</string>
   <string>Jigmo2</string>
   <string>Jigmo3</string>
  </edit>
 </match>
 <!-- Default serif fonts: Latin stays serif, CJK is Sarasa -->
 <match target="pattern">
  <test name="family">
   <string>serif</string>
  </test>
  <edit binding="strong" mode="prepend" name="family">
   <string>Liberation Serif</string>
   <string>Sarasa UI SC</string>
   <string>Noto Serif CJK SC</string>
   <string>Jigmo2</string>
   <string>Jigmo3</string>
  </edit>
 </match>
 <!-- Default monospace fonts: Liberation Mono (Latin) + Sarasa Mono SC (CJK) -->
 <match target="pattern">
  <test name="family">
   <string>monospace</string>
  </test>
  <edit binding="strong" mode="prepend" name="family">
   <string>Liberation Mono</string>
   <string>Sarasa Mono SC</string>
   <string>Noto Sans Mono CJK SC</string>
   <string>Jigmo2</string>
   <string>Jigmo3</string>
  </edit>
 </match>
 <match target="font">
  <edit mode="assign" name="hinting">
   <bool>true</bool>
  </edit>
 </match>
 <match target="font">
  <edit mode="assign" name="hintstyle">
   <const>hintslight</const>
  </edit>
 </match>
 <match target="font">
  <edit mode="assign" name="rgba">
   <const>rgb</const>
  </edit>
 </match>
 <!-- Sub-pixel LCD filter: keeps the RGB sub-pixel rendering from looking
      washed out. Only takes effect while rgba=rgb (above) and antialias=true.
      Values: lcdnone / lcddefault / lcdlight / lcdlegacy. -->
 <match target="font">
  <edit mode="assign" name="lcdfilter">
   <const>lcddefault</const>
  </edit>
 </match>
 <dir>~/.local/share/fonts</dir>
 <match target="font">
  <edit mode="assign" name="antialias">
   <bool>true</bool>
  </edit>
 </match>
</fontconfig>
