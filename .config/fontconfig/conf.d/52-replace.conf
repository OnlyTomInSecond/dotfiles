<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>

  <!--
    Alias common Windows/Linux font names onto the stack from 50-general.conf.
      Western sans  -> Liberation Sans (+ Sarasa UI SC for CJK)
      Western serif -> Liberation Serif (+ Sarasa UI SC for CJK)
      CJK sans/serif -> Sarasa UI SC  (Source Han Sans; 中文仍用更纱)
    Note: SimSun/宋体/FangSong/仿宋 are serif faces by design; they are mapped
    to the sans stack on purpose (as before). Point them at
    "Noto Serif CJK SC" if you want a real Song/Ming look.
  -->

  <!-- Replace sans-serif fonts -->
  <match target="pattern">
    <test name="family">
      <string>Cantarell</string>
    </test>
    <edit name="family" binding="same">
      <string>Liberation Sans</string>
      <string>Sarasa UI SC</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family">
      <string>Arial</string>
    </test>
    <edit name="family" binding="same">
      <string>Liberation Sans</string>
      <string>Sarasa UI SC</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family">
      <string>Tahoma</string>
    </test>
    <edit name="family" binding="same">
      <string>Liberation Sans</string>
      <string>Sarasa UI SC</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family">
      <string>Calibri</string>
    </test>
    <edit name="family" binding="same">
      <string>Liberation Sans</string>
      <string>Sarasa UI SC</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family">
      <string>Helvetica</string>
    </test>
    <edit name="family" binding="same">
      <string>Liberation Sans</string>
      <string>Sarasa UI SC</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family">
      <string>Liberation Sans</string>
    </test>
    <edit name="family" binding="same">
      <string>Liberation Sans</string>
      <string>Sarasa UI SC</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family" compare="contains">
      <string>Microsoft YaHei</string>
    </test>
    <edit name="family" binding="same">
      <string>Sarasa UI SC</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family">
      <string>微软雅黑</string>
    </test>
    <edit name="family" binding="same">
      <string>Sarasa UI SC</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family">
      <string>SimHei</string>
    </test>
    <edit name="family" binding="same">
      <string>Sarasa UI SC</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family">
      <string>黑体</string>
    </test>
    <edit name="family" binding="same">
      <string>Sarasa UI SC</string>
    </edit>
  </match>

  <!-- Replace serif fonts -->
  <match target="pattern">
    <test name="family">
      <string>Times New Roman</string>
    </test>
    <edit name="family" binding="same">
      <string>Liberation Serif</string>
      <string>Sarasa UI SC</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family">
      <string>Liberation Serif</string>
    </test>
    <edit name="family" binding="same">
      <string>Liberation Serif</string>
      <string>Sarasa UI SC</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family" compare="contains">
      <string>SimSun</string>
    </test>
    <edit name="family" binding="same">
      <string>Sarasa UI SC</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family">
      <string>宋体</string>
    </test>
    <edit name="family" binding="same">
      <string>Sarasa UI SC</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family">
      <string>FangSong</string>
    </test>
    <edit name="family" binding="same">
      <string>Sarasa UI SC</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family">
      <string>仿宋</string>
    </test>
    <edit name="family" binding="same">
      <string>Sarasa UI SC</string>
    </edit>
  </match>

</fontconfig>
