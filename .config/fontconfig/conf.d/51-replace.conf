<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>

  <!--
    Alias common Windows/macOS/Linux font names onto the stack from
    50-general.conf.
      Western sans  -> Noto Sans   (+ Noto Sans CJK SC for CJK)
      Western serif -> Noto Serif  (+ Noto Serif CJK SC for CJK)
      CJK sans      -> Noto Sans CJK SC
    Note: SimSun/宋体/FangSong/仿宋 are serif faces by design; they are mapped
    to the sans stack on purpose (as before). Point them at
    "Noto Serif CJK SC" if you want a real Song/Ming look.
  -->

  <!-- Replace sans-serif fonts -->
  <match target="pattern">
    <test name="family">
      <string>Cantarell</string>
    </test>
    <edit name="family" binding="same">
      <string>Noto Sans</string>
      <string>Noto Sans CJK SC</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family">
      <string>Arial</string>
    </test>
    <edit name="family" binding="same">
      <string>Noto Sans</string>
      <string>Noto Sans CJK SC</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family">
      <string>Tahoma</string>
    </test>
    <edit name="family" binding="same">
      <string>Noto Sans</string>
      <string>Noto Sans CJK SC</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family">
      <string>Calibri</string>
    </test>
    <edit name="family" binding="same">
      <string>Noto Sans</string>
      <string>Noto Sans CJK SC</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family">
      <string>Helvetica</string>
    </test>
    <edit name="family" binding="same">
      <string>Noto Sans</string>
      <string>Noto Sans CJK SC</string>
    </edit>
  </match>

  <!-- Requested Noto Sans directly: append the CJK face for coverage -->
  <match target="pattern">
    <test name="family">
      <string>Noto Sans</string>
    </test>
    <edit name="family" binding="same">
      <string>Noto Sans</string>
      <string>Noto Sans CJK SC</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family" compare="contains">
      <string>Microsoft YaHei</string>
    </test>
    <edit name="family" binding="same">
      <string>Noto Sans CJK SC</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family">
      <string>微软雅黑</string>
    </test>
    <edit name="family" binding="same">
      <string>Noto Sans CJK SC</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family">
      <string>SimHei</string>
    </test>
    <edit name="family" binding="same">
      <string>Noto Sans CJK SC</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family">
      <string>黑体</string>
    </test>
    <edit name="family" binding="same">
      <string>Noto Sans CJK SC</string>
    </edit>
  </match>

  <!-- Replace serif fonts -->
  <match target="pattern">
    <test name="family">
      <string>Times New Roman</string>
    </test>
    <edit name="family" binding="same">
      <string>Noto Serif</string>
      <string>Noto Serif CJK SC</string>
    </edit>
  </match>

  <!-- Requested Noto Serif directly: append the CJK face for coverage -->
  <match target="pattern">
    <test name="family">
      <string>Noto Serif</string>
    </test>
    <edit name="family" binding="same">
      <string>Noto Serif</string>
      <string>Noto Serif CJK SC</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family" compare="contains">
      <string>SimSun</string>
    </test>
    <edit name="family" binding="same">
      <string>Noto Sans CJK SC</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family">
      <string>宋体</string>
    </test>
    <edit name="family" binding="same">
      <string>Noto Sans CJK SC</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family">
      <string>FangSong</string>
    </test>
    <edit name="family" binding="same">
      <string>Noto Sans CJK SC</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family">
      <string>仿宋</string>
    </test>
    <edit name="family" binding="same">
      <string>Noto Sans CJK SC</string>
    </edit>
  </match>

  <!--
    CJK families that Windows / macOS / websites ask for but that are not
    installed here.  Map them to the closest Noto CJK regional face so that web
    pages and Wine/Proton apps do not fall back to whatever font happens to
    sort first ("Microsoft YaHei" used to end up as Noto Sans CJK SC only by
    accident of the generic stack).

    Simplified Chinese -> SC, Traditional -> TC, HK -> HK, Japanese -> JP.
    Latin inside these requests still comes from the generic stack via
    50-general.conf, these rules only replace the requested family name.
  -->

  <!-- Simplified Chinese (macOS / Windows) -->
  <match target="pattern">
    <test name="family">
      <string>PingFang SC</string>
    </test>
    <edit name="family" binding="same">
      <string>Noto Sans CJK SC</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family" compare="contains">
      <string>Hiragino Sans GB</string>
    </test>
    <edit name="family" binding="same">
      <string>Noto Sans CJK SC</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family">
      <string>Heiti SC</string>
    </test>
    <edit name="family" binding="same">
      <string>Noto Sans CJK SC</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family">
      <string>Songti SC</string>
    </test>
    <edit name="family" binding="same">
      <string>Noto Serif CJK SC</string>
    </edit>
  </match>

  <!-- Traditional Chinese / Hong Kong -->
  <match target="pattern">
    <test name="family">
      <string>PingFang TC</string>
    </test>
    <edit name="family" binding="same">
      <string>Noto Sans CJK TC</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family">
      <string>PingFang HK</string>
    </test>
    <edit name="family" binding="same">
      <string>Noto Sans CJK HK</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family" compare="contains">
      <string>Microsoft JhengHei</string>
    </test>
    <edit name="family" binding="same">
      <string>Noto Sans CJK TC</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family">
      <string>Songti TC</string>
    </test>
    <edit name="family" binding="same">
      <string>Noto Serif CJK TC</string>
    </edit>
  </match>

  <!-- Japanese -->
  <match target="pattern">
    <test name="family" compare="contains">
      <string>Hiragino</string>
    </test>
    <edit name="family" binding="same">
      <string>Noto Sans CJK JP</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family">
      <string>MS PGothic</string>
    </test>
    <edit name="family" binding="same">
      <string>Noto Sans CJK JP</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family" compare="contains">
      <string>Meiryo</string>
    </test>
    <edit name="family" binding="same">
      <string>Noto Sans CJK JP</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family" compare="contains">
      <string>Yu Gothic</string>
    </test>
    <edit name="family" binding="same">
      <string>Noto Sans CJK JP</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family" compare="contains">
      <string>MS Gothic</string>
    </test>
    <edit name="family" binding="same">
      <string>Noto Sans CJK JP</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family" compare="contains">
      <string>MS Mincho</string>
    </test>
    <edit name="family" binding="same">
      <string>Noto Serif CJK JP</string>
    </edit>
  </match>

</fontconfig>
