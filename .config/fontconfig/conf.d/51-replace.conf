<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>

  <!--
    Alias common Windows/macOS Latin font names onto the stack from
    50-general.conf:

      Western sans  -> Noto Sans
      Western serif -> Noto Serif

    Rules for writing these aliases:

    1. Rewrite to the Latin face only.  Do not append "Noto Sans CJK SC" /
       "Noto Serif CJK SC" to the family list.
    2. Do not alias CJK family names (Microsoft YaHei, PingFang SC, SimSun,
       MS Gothic, ...) at all.

    Both would put a Noto CJK face into the pattern as an *author-requested*
    family.  The CJK faces also cover the squared-CJK emoji block
    (U+1F200-1F2FF: 🈚 🈶 🈯 🉐 ...), so Firefox and Qt then select the
    monochrome CJK glyphs instead of Noto Color Emoji.  Measured with
    headless Firefox at a bilibili-like font stack
    (-apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", ...):
    🈚🈶🈯 render black-and-white as soon as the alias mentions the CJK face,
    and colourful when the alias is absent.

    Nothing is lost by dropping them: fontconfig's per-character fallback
    already resolves Han to Noto Sans CJK SC (or the locale's variant via
    52-cjk.conf), and the generic families keep their emoji-aware ordering
    from 50-general.conf.
  -->

  <!-- ============================ sans ============================ -->

  <match target="pattern">
    <test name="family">
      <string>Cantarell</string>
    </test>
    <edit name="family" binding="same">
      <string>Noto Sans</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family">
      <string>Arial</string>
    </test>
    <edit name="family" binding="same">
      <string>Noto Sans</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family">
      <string>Tahoma</string>
    </test>
    <edit name="family" binding="same">
      <string>Noto Sans</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family">
      <string>Calibri</string>
    </test>
    <edit name="family" binding="same">
      <string>Noto Sans</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family">
      <string>Helvetica</string>
    </test>
    <edit name="family" binding="same">
      <string>Noto Sans</string>
    </edit>
  </match>


  <!-- -apple-system / BlinkMacSystemFont are not real families; browsers fall
       through them on their own, so no rule is needed.  Georgia, Times,
       Consolas, ... are installed locally (msttcorefonts/wps-fonts) and are
       left alone. -->

  <!-- ============================ serif =========================== -->

  <match target="pattern">
    <test name="family">
      <string>Times New Roman</string>
    </test>
    <edit name="family" binding="same">
      <string>Noto Serif</string>
    </edit>
  </match>



</fontconfig>
